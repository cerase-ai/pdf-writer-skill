# Registry display text in the platform's other locales.
#
# The base fields -- SKILL.md's `description` and cerase.json's -- are the SOURCE
# locale and are English; package_translations forbids a row for it, so this file
# can only ever hold the others. It is registry metadata: the seeder keeps it out
# of the bundle that ships to the agent.
it:
  display_name: "Pdf Writer"
  description: "Genera un PDF semplice tramite il convertitore di documenti, da un testo per uso interno — appunti, un riepilogo, un'esportazione, un certificato su una pagina impaginata. Un documento che leggerà un cliente o la direzione (un preventivo, una proposta, una relazione, una lettera) è la skill `business-document`; una presentazione è `deck`; un foglio di calcolo in PDF è `xlsx`."
